<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/index.css">
    <title>Login</title>
</head>

<body>

    <div class="app">
        <header class="app-header">
            <h1>Login / Register</h1>
            <a id="backButton" href="index.html">Back</a>
        </header>

        <form action="" id="loginRegisterForm">
            <input type="text" id="formInputType" value="Register" hidden>
            <input type="text" id="Username" placeholder="Username" required>
            <input type="password" id="Password" placeholder="Password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            <button type="submit" id="loginRegisterButton">Register</button>
            <button type="button" id="changeType" onclick="toggleLoginForm()">I already have an account</button>
        </form>

    </div>
    <script src="cordova.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
